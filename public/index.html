<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Think4Ever LATAM Growth dashboard">
  <title>Overview · LATAM Growth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
      <div class="logo-row"><span class="logo-mark"><i class="fa-solid fa-chart-line"></i></span><span class="logo-name">LATAM <span>Growth</span></span></div>
      <div class="nav-section-label">Dashboards</div>
      <button class="nav-item active" data-page="overview"><i class="fa-solid fa-table-cells"></i>Overview</button>
      <button class="nav-item" data-page="acquisition"><i class="fa-solid fa-globe"></i>Acquisition</button>
      <button class="nav-item" data-page="conversion"><i class="fa-solid fa-filter"></i>Conversion</button>
      <button class="nav-item" data-page="social"><i class="fa-solid fa-bullhorn"></i>Social and Paid</button>
      <button class="nav-item" data-page="targets"><i class="fa-solid fa-bullseye"></i>Targets</button>
      <div class="nav-section-label">Operate</div>
      <button class="nav-item" data-page="ads"><i class="fa-solid fa-rectangle-ad"></i>Ad loader</button>
      <div class="nav-section-label">Data</div>
      <button class="nav-item" data-page="sources"><i class="fa-solid fa-database"></i>Data Sources</button>
      <button class="nav-item" data-page="csv"><i class="fa-solid fa-file-arrow-up"></i>CSV Import</button>
      <button class="nav-item" data-page="notes"><i class="fa-regular fa-message"></i>Timeline Notes</button>
      <div class="sidebar-spacer"></div>
      <div class="user-card"><span class="user-avatar" id="user-avatar">–</span><div class="user-meta"><div class="user-name" id="user-name">Loading…</div><div class="user-role" id="user-role"></div></div></div>
      <div class="sidebar-foot"><span class="live-dot"></span><span id="sources-foot">Loading sources…</span></div>
    </aside>
    <div class="sidebar-scrim" id="scrim"></div>
    <div class="page-main">
      <header class="topbar">
        <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button>
        <div class="top-title"><div class="top-eyebrow">LATAM Growth Dashboard</div><h1 class="page-title" id="page-title">Overview</h1></div>
        <div class="top-actions">
          <select class="period-filter" id="period" aria-label="Temporality"><option value="day" selected>Daily</option><option value="week">Weekly</option><option value="biweek">Bi-weekly</option><option value="month">Monthly</option><option value="quarter">Quarterly</option><option value="year">Yearly</option></select>
          <label class="check-chip"><input type="checkbox" id="ex-int" checked>Exclude internal tests</label>
          <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
          <button type="button" class="btn btn-secondary" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
        </div>
      </header>
      <main class="page-inner" id="view" tabindex="-1"><section class="card">Loading dashboard…</section></main>
      <footer class="foot" id="foot"></footer>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="js/api.js"></script>
  <script src="js/paid.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/acquisition.js"></script>
  <script src="js/views/conversion.js"></script>
  <script src="js/views/social.js"></script>
  <script src="js/views/targets.js"></script>
  <script src="js/views/ads.js"></script>
  <script src="js/views/sources.js"></script>
  <script src="js/views/csv.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
